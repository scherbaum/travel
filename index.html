<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇮🇹 Sizilien Reiseplaner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #111;
  --sidebar-bg: #181818;
  --card-bg: #1f1f1f;
  --card-hover: #272727;
  --text: #f0ece3;
  --muted: #777;
  --accent: #d4a853;
}
html, body {
  height: 100%;
  font-family: 'Georgia', serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
#app {
  display: flex;
  height: 100vh;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 390px;
  min-width: 390px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid #2c2c2c;
  z-index: 10;
}
#header {
  padding: 18px 18px 14px;
  background: linear-gradient(160deg, #1c1100 0%, #261800 100%);
  border-bottom: 1px solid #2c2c2c;
  flex-shrink: 0;
}
#header h1 {
  font-size: 1.25rem;
  color: var(--accent);
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}
#header .subtitle {
  font-size: 0.72rem;
  color: var(--muted);
  font-style: italic;
}
#stats {
  display: flex;
  gap: 16px;
  margin-top: 10px;
}
.stat {
  text-align: center;
  font-size: 0.68rem;
  color: var(--muted);
}
.stat strong {
  display: block;
  font-size: 1.1rem;
  color: var(--accent);
  font-style: normal;
}

#filters {
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  background: #141414;
  border-bottom: 1px solid #242424;
  flex-shrink: 0;
}
.filter-btn {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid #333;
  background: transparent;
  color: #888;
  cursor: pointer;
  font-size: 0.68rem;
  transition: all 0.18s;
  font-family: inherit;
  letter-spacing: 0.02em;
}
.filter-btn:hover { border-color: #555; color: #ccc; }
.filter-btn.active {
  color: #fff !important;
  border-color: transparent;
  font-weight: bold;
}

#place-list {
  overflow-y: auto;
  flex: 1;
  padding: 8px 10px 16px;
  scrollbar-width: thin;
  scrollbar-color: #333 transparent;
}
#place-list::-webkit-scrollbar { width: 4px; }
#place-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

.tour-section { margin-bottom: 8px; }
.tour-header {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 6px 4px;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--muted);
  border-bottom: 1px solid #272727;
  margin-bottom: 5px;
}
.tour-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.place-card {
  background: var(--card-bg);
  border-radius: 8px;
  padding: 11px 12px 11px 13px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: all 0.18s;
  border-left: 3px solid transparent;
}
.place-card:hover {
  background: var(--card-hover);
  transform: translateX(2px);
}
.place-card.active {
  background: #232320;
  box-shadow: 0 0 0 1px rgba(212,168,83,0.2);
}
.card-top {
  display: flex;
  align-items: flex-start;
  gap: 9px;
}
.card-emoji {
  font-size: 1.3rem;
  line-height: 1;
  flex-shrink: 0;
  margin-top: 1px;
  width: 28px;
  text-align: center;
}
.card-body { flex: 1; min-width: 0; }
.card-name {
  font-size: 0.92rem;
  font-weight: bold;
  color: var(--text);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-sub {
  font-size: 0.7rem;
  color: #888;
  margin-bottom: 5px;
  font-style: italic;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 5px;
}
.tag {
  font-size: 0.6rem;
  padding: 2px 5px;
  border-radius: 8px;
  background: #2a2a2a;
  color: #999;
  font-family: system-ui, sans-serif;
  letter-spacing: 0.01em;
}
.card-desc {
  font-size: 0.76rem;
  color: #999;
  line-height: 1.45;
}
.card-tips {
  margin-top: 7px;
  font-size: 0.7rem;
  color: var(--accent);
  opacity: 0.75;
  font-style: italic;
  border-top: 1px solid #2a2a2a;
  padding-top: 6px;
}

/* ── MAP ── */
#map-container {
  flex: 1;
  position: relative;
  min-width: 0;
}
#map { width: 100%; height: 100%; }

/* leaflet popup dark */
.leaflet-popup-content-wrapper {
  background: rgba(20,18,14,0.97) !important;
  color: #f0ece3 !important;
  border-radius: 10px !important;
  border: 1px solid #3a3a3a !important;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
}
.leaflet-popup-tip { background: rgba(20,18,14,0.97) !important; }
.leaflet-popup-content { margin: 14px 16px !important; }
.popup-emoji { font-size: 1.6rem; margin-bottom: 6px; }
.popup-title { font-size: 1rem; font-weight: bold; margin-bottom: 5px; color: #f0ece3; }
.popup-sub { font-size: 0.72rem; color: #888; margin-bottom: 8px; font-style: italic; }
.popup-highlights {
  list-style: none;
  font-size: 0.78rem;
  color: #bbb;
  line-height: 1.7;
}
.popup-highlights li::before { content: "✦ "; color: var(--accent); }
.popup-tip {
  margin-top: 8px;
  padding: 7px 9px;
  background: rgba(212,168,83,0.08);
  border-radius: 6px;
  font-size: 0.72rem;
  color: #c49a42;
  font-style: italic;
  border-left: 2px solid #c49a42;
}

/* map attribution tweaks */
.leaflet-control-attribution { font-size: 0.6rem; background: rgba(0,0,0,0.6) !important; color: #666 !important; }
.leaflet-control-attribution a { color: #888 !important; }
.leaflet-control-zoom a {
  background: #1f1f1f !important;
  color: #ccc !important;
  border-color: #333 !important;
}
.leaflet-control-zoom a:hover { background: #2a2a2a !important; color: #fff !important; }

/* map overlay title */
#map-overlay {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 500;
  background: rgba(17,17,17,0.88);
  backdrop-filter: blur(8px);
  border-radius: 10px;
  padding: 10px 14px;
  border: 1px solid #2c2c2c;
  font-size: 0.72rem;
  color: var(--muted);
  max-width: 200px;
  text-align: center;
}
#map-overlay strong { display: block; color: var(--accent); font-size: 0.85rem; margin-bottom: 2px; }

/* mobile */
@media (max-width: 700px) {
  #app { flex-direction: column; }
  #sidebar { width: 100%; min-width: unset; max-height: 50vh; }
  #map-container { height: 50vh; flex: none; }
  #map-overlay { display: none; }
}
</style>
</head>
<body>

// ── LEAFLET MAP ──
const map = L.map('map', {
  center: [37.5, 14.2],
  zoom: 8,
  zoomControl: true,
  attributionControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://carto.com/">CARTO</a> © <a href="https://www.openstreetmap.org/copyright">OSM</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// marker icon per tour
function makeIcon(tour, active = false) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width: ${active ? 38 : 32}px;
      height: ${active ? 38 : 32}px;
      background: ${tour.color};
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      transition: all 0.2s;
    "><div style="
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
      font-size: ${active ? '16px' : '13px'};
    ">${tour.emoji}</div></div>`,
    iconSize: [active ? 38 : 32, active ? 38 : 32],
    iconAnchor: [active ? 19 : 16, active ? 38 : 32]
  });
}

// Build markers
const markers = {};
let activeCard = null;

TOURS.forEach(tour => {
  tour.places.forEach(place => {
    const marker = L.marker([place.lat, place.lng], {
      icon: makeIcon(tour)
    }).addTo(map);

    marker.bindPopup(`
      <div class="popup-emoji">${place.emoji}</div>
      <div class="popup-title">${place.name}</div>
      <div class="popup-sub">${place.sub}</div>
      <ul class="popup-highlights">
        ${place.highlights.slice(0, 4).map(h => `<li>${h}</li>`).join('')}
      </ul>
      ${place.tip ? `<div class="popup-tip">💡 ${place.tip}</div>` : ''}
    `, {
      maxWidth: 280,
      className: 'dark-popup'
    });

    marker.on('click', () => {
      highlightCard(place.id, tour, marker);
    });

    markers[place.id] = { marker, tour };
  });
});

function highlightCard(placeId, tour, marker) {
  // reset previous
  if (activeCard) {
    const el = document.getElementById('card-' + activeCard.id);
    if (el) el.classList.remove('active');
    const prev = markers[activeCard.id];
    if (prev) prev.marker.setIcon(makeIcon(prev.tour));
  }

  // activate new
  const card = document.getElementById('card-' + placeId);
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  marker.setIcon(makeIcon(tour, true));
  activeCard = { id: placeId };
}

// ── BUILD SIDEBAR ──
const filterDiv = document.getElementById('filters');
const listDiv = document.getElementById('place-list');

let activeTour = 'all';

function renderList() {
  listDiv.innerHTML = '';
  const toShow = activeTour === 'all' ? TOURS : TOURS.filter(t => t.id === activeTour);

  toShow.forEach(tour => {
    const section = document.createElement('div');
    section.className = 'tour-section';

    section.innerHTML = `
      <div class="tour-header">
        <div class="tour-dot" style="background: ${tour.color}"></div>
        ${tour.emoji} ${tour.name}
      </div>
    `;

    tour.places.forEach(place => {
      const card = document.createElement('div');
      card.className = 'place-card';
      card.id = 'card-' + place.id;
      card.style.borderLeftColor = tour.color;
      card.innerHTML = `
        <div class="card-top">
          <div class="card-emoji">${place.emoji}</div>
          <div class="card-body">
            <div class="card-name">${place.name}</div>
            <div class="card-sub">${place.sub}</div>
            <div class="card-tags">${place.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            <div class="card-desc">${place.desc}</div>
            ${place.tip ? `<div class="card-tips">💡 ${place.tip}</div>` : ''}
          </div>
        </div>
      `;

      card.addEventListener('click', () => {
        const m = markers[place.id];
        if (m) {
          map.flyTo([place.lat, place.lng], 13, { duration: 1.2 });
          setTimeout(() => m.marker.openPopup(), 1200);
          highlightCard(place.id, tour, m.marker);
        }
      });

      section.appendChild(card);
    });

    listDiv.appendChild(section);
  });
}

// filter buttons
TOURS.forEach(tour => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.tour = tour.id;
  btn.style.color = tour.color;
  btn.style.borderColor = tour.color + '44';
  btn.innerHTML = `${tour.emoji} ${tour.name.split(' ')[0]}`;
  btn.addEventListener('click', () => {
    activeTour = tour.id;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    btn.style.background = tour.color;
    btn.style.color = '#fff';

    // show only those markers
    TOURS.forEach(t => {
      t.places.forEach(p => {
        const m = markers[p.id];
        if (m) {
          if (activeTour === 'all' || t.id === activeTour) {
            m.marker.addTo(map);
          } else {
            map.removeLayer(m.marker);
          }
        }
      });
    });

    // fly to tour centroid
    if (activeTour !== 'all') {
      const tourObj = TOURS.find(t => t.id === activeTour);
      const lats = tourObj.places.map(p => p.lat);
      const lngs = tourObj.places.map(p => p.lng);
      const centerLat = lats.reduce((a, b) => a + b) / lats.length;
      const centerLng = lngs.reduce((a, b) => a + b) / lngs.length;
      map.flyTo([centerLat, centerLng], 11, { duration: 1 });
    } else {
      map.flyTo([37.5, 14.2], 8, { duration: 1 });
    }

    renderList();
  });
  filterDiv.appendChild(btn);
});

// "Alle" button click
document.querySelector('[data-tour="all"]').addEventListener('click', () => {
  activeTour = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active');
    const tour = TOURS.find(t => t.id === b.dataset.tour);
    if (tour) { b.style.background = 'transparent'; b.style.color = tour.color; }
  });
  const allBtn = document.querySelector('[data-tour="all"]');
  allBtn.classList.add('active');
  allBtn.style.background = '#333';
  allBtn.style.color = '#fff';

  // show all markers
  TOURS.forEach(t => t.places.forEach(p => {
    const m = markers[p.id];
    if (m) m.marker.addTo(map);
  }));

  map.flyTo([37.5, 14.2], 8, { duration: 1 });
  renderList();
});

// update stats
document.getElementById('stat-orte').textContent = TOURS.reduce((a, t) => a + t.places.length, 0);
document.getElementById('stat-touren').textContent = TOURS.length;

renderList();
</script>
