<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Reisen</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  --radius: 8px;
  --transition: 0.18s ease;
}

[data-theme="dark"] {
  --bg: #111;
  --sidebar: #181818;
  --header-bg: #141008;
  --card: #1f1f1f;
  --card-hover: #272727;
  --card-active: #252520;
  --border: #2a2a2a;
  --text: #f0ece3;
  --text-muted: #777;
  --text-sub: #999;
  --accent: #d4a853;
  --insta: #E1306C;
  --tag-bg: #2a2a2a;
  --tag-text: #999;
  --popup-bg: rgba(18,16,12,0.97);
  --toggle-icon: "☀️";
  --scrollbar: #333;
  --tip-bg: rgba(212,168,83,0.08);
  --tip-border: #c49a42;
  --tip-text: #c49a42;
  --breadcrumb-sep: #555;
  --trip-btn-hover: #252525;
}

[data-theme="light"] {
  --bg: #f2f0eb;
  --sidebar: #ffffff;
  --header-bg: #fffdf5;
  --card: #faf9f6;
  --card-hover: #f0ede5;
  --card-active: #ece9e0;
  --border: #e0ddd5;
  --text: #1a1810;
  --text-muted: #888;
  --text-sub: #666;
  --accent: #b8882a;
  --insta: #C2185B;
  --tag-bg: #ede9e0;
  --tag-text: #666;
  --popup-bg: rgba(255,253,248,0.97);
  --toggle-icon: "🌙";
  --scrollbar: #ccc;
  --tip-bg: rgba(184,136,42,0.06);
  --tip-border: #b8882a;
  --tip-text: #9a6e1a;
  --breadcrumb-sep: #bbb;
  --trip-btn-hover: #f0ede5;
}

html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  transition: background var(--transition), color var(--transition);
}

#app {
  display: flex;
  height: 100vh;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 380px;
  min-width: 380px;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--border);
  z-index: 10;
  transition: background var(--transition);
}

#header {
  padding: 14px 16px 12px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

#header-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  font-weight: 600;
}

#theme-toggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px;
  cursor: pointer;
  font-size: 0.75rem;
  color: var(--text-muted);
  transition: all var(--transition);
  font-family: var(--font);
}
#theme-toggle:hover { border-color: var(--text-muted); color: var(--text); }

/* Breadcrumb / trip nav */
#breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.bc-item {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
}
.bc-item.clickable {
  color: var(--accent);
  cursor: pointer;
}
.bc-item.clickable:hover { text-decoration: underline; }

.bc-sep {
  font-size: 0.7rem;
  color: var(--breadcrumb-sep);
}

/* Trip list view */
#trip-list {
  padding: 12px;
  display: none;
}

.trip-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--border);
  cursor: pointer;
  margin-bottom: 8px;
  font-family: var(--font);
  color: var(--text);
  width: 100%;
  text-align: left;
  transition: all var(--transition);
}
.trip-btn:hover { background: var(--trip-btn-hover); }
.trip-btn .trip-flag { font-size: 1.6rem; }
.trip-btn .trip-info { flex: 1; }
.trip-btn .trip-name { font-size: 0.95rem; font-weight: 600; }
.trip-btn .trip-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }

.trip-add-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px dashed var(--border);
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-family: var(--font);
  font-size: 0.82rem;
  width: 100%;
  transition: all var(--transition);
}
.trip-add-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Tour filters */
#filters {
  padding: 8px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.filter-btn {
  padding: 4px 9px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.67rem;
  transition: all var(--transition);
  font-family: var(--font);
  letter-spacing: 0.02em;
}
.filter-btn:hover { color: var(--text); }
.filter-btn.active { color: #fff !important; border-color: transparent; font-weight: 600; }

/* Place list */
#place-list {
  overflow-y: auto;
  flex: 1;
  padding: 8px 10px 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar) transparent;
}
#place-list::-webkit-scrollbar { width: 4px; }
#place-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

.tour-section { margin-bottom: 6px; }

.tour-header {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 4px 4px;
  font-size: 0.63rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  margin-bottom: 5px;
}
.tour-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.place-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 12px 10px 13px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: all var(--transition);
  border-left: 3px solid transparent;
}
.place-card:hover { background: var(--card-hover); transform: translateX(2px); }
.place-card.active { background: var(--card-active); }

.card-top { display: flex; align-items: flex-start; gap: 9px; }
.card-emoji { font-size: 1.2rem; line-height: 1; flex-shrink: 0; margin-top: 1px; width: 26px; text-align: center; }
.card-body { flex: 1; min-width: 0; }
.card-name { font-size: 0.9rem; font-weight: 600; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 0.68rem; color: var(--text-sub); margin-bottom: 4px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
.tag { font-size: 0.6rem; padding: 2px 5px; border-radius: 8px; background: var(--tag-bg); color: var(--tag-text); }
.card-desc { font-size: 0.74rem; color: var(--text-sub); line-height: 1.45; }
.card-tips { margin-top: 6px; font-size: 0.68rem; color: var(--tip-text); font-style: italic; border-top: 1px solid var(--border); padding-top: 5px; background: var(--tip-bg); padding: 5px 6px; border-radius: 5px; margin-top: 6px; }

/* Instagram spot cards */
.insta-card {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.insta-thumb {
  width: 58px;
  height: 58px;
  object-fit: cover;
  border-radius: 6px;
  flex-shrink: 0;
  border: 1px solid var(--border);
}
.insta-thumb-placeholder {
  width: 58px;
  height: 58px;
  background: var(--tag-bg);
  border-radius: 6px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  border: 1px solid var(--border);
}
.insta-body { flex: 1; min-width: 0; }
.insta-user { font-size: 0.65rem; color: var(--insta); margin-bottom: 3px; }
.insta-link { display: inline-block; margin-top: 6px; font-size: 0.63rem; color: var(--insta); text-decoration: none; opacity: 0.8; }
.insta-link:hover { opacity: 1; }

/* ── MAP ── */
#map-container { flex: 1; position: relative; min-width: 0; }
#map { width: 100%; height: 100%; }

/* Map overlay */
#map-hint {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 500;
  background: var(--popup-bg);
  border-radius: 10px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  font-size: 0.7rem;
  color: var(--text-muted);
  backdrop-filter: blur(8px);
  pointer-events: none;
}
#map-hint strong { display: block; color: var(--accent); font-size: 0.8rem; margin-bottom: 1px; }

/* Leaflet dark popup */
.leaflet-popup-content-wrapper {
  background: var(--popup-bg) !important;
  color: var(--text) !important;
  border-radius: 10px !important;
  border: 1px solid var(--border) !important;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4) !important;
}
.leaflet-popup-tip { background: var(--popup-bg) !important; }
.leaflet-popup-content { margin: 13px 16px !important; }
.popup-emoji { font-size: 1.5rem; margin-bottom: 5px; }
.popup-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 3px; }
.popup-sub { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 7px; font-style: italic; }
.popup-highlights { list-style: none; font-size: 0.76rem; color: var(--text-sub); line-height: 1.7; }
.popup-highlights li::before { content: "✦ "; color: var(--accent); }
.popup-tip { margin-top: 7px; padding: 6px 8px; background: var(--tip-bg); border-radius: 5px; font-size: 0.7rem; color: var(--tip-text); font-style: italic; border-left: 2px solid var(--tip-border); }

.leaflet-control-attribution { font-size: 0.58rem; background: var(--popup-bg) !important; color: var(--text-muted) !important; }
.leaflet-control-attribution a { color: var(--text-muted) !important; }
.leaflet-control-zoom a { background: var(--card) !important; color: var(--text) !important; border-color: var(--border) !important; }
.leaflet-control-zoom a:hover { background: var(--card-hover) !important; }

/* mobile */
@media (max-width: 700px) {
  #app { flex-direction: column; }
  #sidebar { width: 100%; min-width: unset; max-height: 50vh; }
  #map-container { height: 50vh; flex: none; }
  #map-hint { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="header">
      <div id="header-top">
        <div id="header-title">Meine Reisen</div>
        <button id="theme-toggle">☀️ Hell</button>
      </div>
      <div id="breadcrumb">
        <span class="bc-item clickable" id="bc-root">🌍 Alle Reisen</span>
        <span class="bc-sep" id="bc-sep" style="display:none">›</span>
        <span class="bc-item" id="bc-trip" style="display:none"></span>
      </div>
    </div>

    <div id="trip-list"></div>
    <div id="filters" style="display:none"></div>
    <div id="place-list"></div>
  </div>

  <div id="map-container">
    <div id="map"></div>
    <div id="map-hint">
      <strong>Klicke einen Ort</strong>
      für Details &amp; Tipps
    </div>
  </div>
</div>

// ── LEAFLET MAP ──
const map = L.map('map', { center: [37.5, 14.2], zoom: 8, zoomControl: true });

let currentTileLayer = null;

function setMapTiles(theme) {
  if (currentTileLayer) map.removeLayer(currentTileLayer);
  if (theme === 'dark') {
    currentTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://carto.com/">CARTO</a> © <a href="https://www.openstreetmap.org/copyright">OSM</a>',
      subdomains: 'abcd', maxZoom: 19
    });
  } else {
    currentTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://carto.com/">CARTO</a> © <a href="https://www.openstreetmap.org/copyright">OSM</a>',
      subdomains: 'abcd', maxZoom: 19
    });
  }
  currentTileLayer.addTo(map);
}

// ── THEME ──
const root = document.documentElement;
let theme = localStorage.getItem('theme') || 'dark';
root.setAttribute('data-theme', theme);
setMapTiles(theme);

const themeBtn = document.getElementById('theme-toggle');
themeBtn.textContent = theme === 'dark' ? '☀️ Hell' : '🌙 Dunkel';

themeBtn.addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  themeBtn.textContent = theme === 'dark' ? '☀️ Hell' : '🌙 Dunkel';
  setMapTiles(theme);
});

// ── MARKER FACTORY ──
function makeIcon(color, emoji, active = false) {
  const size = active ? 36 : 30;
  return L.divIcon({
    className: '',
    html: `<div style="width:${size}px;height:${size}px;background:${color};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid rgba(255,255,255,0.25);box-shadow:0 3px 10px rgba(0,0,0,0.4)"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);font-size:${active?15:12}px">${emoji}</div></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size]
  });
}

// ── STATE ──
let currentTrip = null;
let activeTour = 'all';
let activeCardId = null;
const markers = {};

function resetMarkers() {
  Object.values(markers).forEach(({ marker }) => map.removeLayer(marker));
  Object.keys(markers).forEach(k => delete markers[k]);
}

// ── TRIP LIST ──
const tripListEl = document.getElementById('trip-list');
const filtersEl = document.getElementById('filters');
const placeListEl = document.getElementById('place-list');
const bcRoot = document.getElementById('bc-root');
const bcSep = document.getElementById('bc-sep');
const bcTrip = document.getElementById('bc-trip');

function showTripList() {
  currentTrip = null;
  activeTour = 'all';
  activeCardId = null;
  resetMarkers();

  bcSep.style.display = 'none';
  bcTrip.style.display = 'none';
  bcRoot.classList.add('clickable');
  tripListEl.style.display = 'block';
  filtersEl.style.display = 'none';
  placeListEl.innerHTML = '';

  tripListEl.innerHTML = '';
  TRIPS.forEach(trip => {
    const totalPlaces = trip.tours.reduce((a, t) => a + t.places.length, 0);
    const btn = document.createElement('button');
    btn.className = 'trip-btn';
    btn.innerHTML = `<div class="trip-flag">${trip.flag}</div><div class="trip-info"><div class="trip-name">${trip.name}</div><div class="trip-sub">${totalPlaces} Orte · ${trip.tours.length} Touren</div></div><div style="font-size:0.9rem;color:var(--text-muted)">›</div>`;
    btn.addEventListener('click', () => openTrip(trip));
    tripListEl.appendChild(btn);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'trip-add-btn';
  addBtn.innerHTML = `<span style="font-size:1rem">+</span> Neue Reise hinzufügen`;
  addBtn.addEventListener('click', () => alert('Neue Reise: kommt bald!'));
  tripListEl.appendChild(addBtn);

  map.flyTo([30, 14], 3, { duration: 1.2 });
}

function openTrip(trip) {
  currentTrip = trip;
  activeTour = 'all';
  activeCardId = null;

  bcRoot.classList.add('clickable');
  bcSep.style.display = '';
  bcTrip.style.display = '';
  bcTrip.textContent = `${trip.flag} ${trip.name}`;

  tripListEl.style.display = 'none';
  filtersEl.style.display = '';

  buildFilters(trip);
  buildPlaceList(trip, 'all');
  buildMarkers(trip);

  map.flyTo(trip.center, trip.zoom, { duration: 1.2 });

  // load user spots
  loadUserSpots(trip.id);
}

bcRoot.addEventListener('click', showTripList);

// ── FILTERS ──
function buildFilters(trip) {
  filtersEl.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.dataset.tour = 'all';
  allBtn.style.background = '#555';
  allBtn.style.color = '#fff';
  allBtn.style.borderColor = 'transparent';
  allBtn.textContent = 'Alle';
  allBtn.addEventListener('click', () => setTour(trip, 'all', allBtn));
  filtersEl.appendChild(allBtn);

  trip.tours.forEach(tour => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.tour = tour.id;
    btn.style.color = tour.color;
    btn.style.borderColor = tour.color + '55';
    btn.textContent = `${tour.emoji} ${tour.name.split(' ')[0]}`;
    btn.addEventListener('click', () => setTour(trip, tour.id, btn));
    filtersEl.appendChild(btn);
  });
}

function setTour(trip, tourId, clickedBtn) {
  activeTour = tourId;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = 'transparent';
    const t = trip.tours.find(x => x.id === b.dataset.tour);
    if (t) b.style.color = t.color;
    if (b.dataset.tour === 'all') { b.style.color = 'var(--text-muted)'; b.style.borderColor = 'var(--border)'; }
  });
  clickedBtn.classList.add('active');
  if (tourId === 'all') {
    clickedBtn.style.background = '#555'; clickedBtn.style.color = '#fff'; clickedBtn.style.borderColor = 'transparent';
  } else {
    const t = trip.tours.find(x => x.id === tourId);
    clickedBtn.style.background = t.color; clickedBtn.style.color = '#fff'; clickedBtn.style.borderColor = 'transparent';
  }

  // update markers visibility
  trip.tours.forEach(t => {
    t.places.forEach(p => {
      const m = markers[p.id];
      if (!m) return;
      if (tourId === 'all' || t.id === tourId) m.marker.addTo(map);
      else map.removeLayer(m.marker);
    });
  });

  if (tourId !== 'all') {
    const t = trip.tours.find(x => x.id === tourId);
    const lats = t.places.map(p => p.lat), lngs = t.places.map(p => p.lng);
    map.flyTo([lats.reduce((a,b)=>a+b)/lats.length, lngs.reduce((a,b)=>a+b)/lngs.length], 10, { duration: 1 });
  } else {
    map.flyTo(trip.center, trip.zoom, { duration: 1 });
  }

  buildPlaceList(trip, tourId);
}

// ── PLACE LIST ──
function buildPlaceList(trip, tourId) {
  placeListEl.innerHTML = '';
  const toShow = tourId === 'all' ? trip.tours : trip.tours.filter(t => t.id === tourId);

  toShow.forEach(tour => {
    const section = document.createElement('div');
    section.className = 'tour-section';
    section.innerHTML = `<div class="tour-header"><div class="tour-dot" style="background:${tour.color}"></div>${tour.emoji} ${tour.name}</div>`;

    tour.places.forEach(place => {
      const card = document.createElement('div');
      card.className = 'place-card';
      card.id = 'card-' + place.id;
      card.style.borderLeftColor = tour.color;
      card.innerHTML = `<div class="card-top"><div class="card-emoji">${place.emoji}</div><div class="card-body"><div class="card-name">${place.name}</div><div class="card-sub">${place.sub}</div><div class="card-tags">${place.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="card-desc">${place.desc}</div>${place.tip?`<div class="card-tips">💡 ${place.tip}</div>`:''}</div></div>`;
      card.addEventListener('click', () => {
        const m = markers[place.id];
        if (m) {
          map.flyTo([place.lat, place.lng], 13, { duration: 1.2 });
          setTimeout(() => m.marker.openPopup(), 1200);
          highlightCard(place.id, tour.color, m.marker, tour);
        }
      });
      section.appendChild(card);
    });
    placeListEl.appendChild(section);
  });
}

// ── MARKERS ──
function buildMarkers(trip) {
  resetMarkers();
  trip.tours.forEach(tour => {
    tour.places.forEach(place => {
      const marker = L.marker([place.lat, place.lng], { icon: makeIcon(tour.color, tour.emoji) }).addTo(map);
      marker.bindPopup(`<div class="popup-emoji">${place.emoji}</div><div class="popup-title">${place.name}</div><div class="popup-sub">${place.sub}</div><ul class="popup-highlights">${place.highlights.slice(0,4).map(h=>`<li>${h}</li>`).join('')}</ul>${place.tip?`<div class="popup-tip">💡 ${place.tip}</div>`:''}`);
      marker.on('click', () => highlightCard(place.id, tour.color, marker, tour));
      markers[place.id] = { marker, tour };
    });
  });
}

function highlightCard(placeId, color, marker, tour) {
  if (activeCardId) {
    const prev = document.getElementById('card-' + activeCardId);
    if (prev) prev.classList.remove('active');
    const pm = markers[activeCardId];
    if (pm) pm.marker.setIcon(makeIcon(pm.tour.color, pm.tour.emoji));
  }
  const card = document.getElementById('card-' + placeId);
  if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  marker.setIcon(makeIcon(color, tour.emoji, true));
  activeCardId = placeId;
}

// ── USER SPOTS (Instagram) ──
async function loadUserSpots(tripId) {
  try {
    const res = await fetch('/user-spots.json?v=' + Date.now());
    if (!res.ok) return;
    const spots = await res.json();
    const tripSpots = spots.filter(s => !s.trip || s.trip === tripId);
    if (!tripSpots.length) return;
    renderUserSpots(tripSpots);
  } catch(e) {}
}

function renderUserSpots(spots) {
  const section = document.createElement('div');
  section.className = 'tour-section';
  section.innerHTML = `<div class="tour-header"><div class="tour-dot" style="background:var(--insta)"></div>📸 Deine Fundstücke</div>`;

  spots.forEach(spot => {
    const card = document.createElement('div');
    card.className = 'place-card';
    card.id = 'spot-' + spot.id;
    card.style.borderLeftColor = 'var(--insta)';
    const img = spot.image ? `<img src="${spot.image}" class="insta-thumb" alt="">` : `<div class="insta-thumb-placeholder">📸</div>`;
    card.innerHTML = `<div class="insta-card">${img}<div class="insta-body"><div class="card-name" style="font-size:0.85rem">${spot.name}</div><div class="insta-user">@${spot.username}</div><div class="card-tags">${(spot.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="card-desc" style="font-size:0.72rem">${spot.desc}</div><a href="${spot.source_url}" target="_blank" class="insta-link">→ Instagram</a></div></div>`;
    if (spot.lat && spot.lng) {
      const m = L.marker([spot.lat, spot.lng], { icon: makeIcon('var(--insta)', '📸') }).addTo(map).bindPopup(`<div class="popup-emoji">📸</div><div class="popup-title">${spot.name}</div><div class="popup-sub">@${spot.username}</div>`);
      card.addEventListener('click', () => { map.flyTo([spot.lat, spot.lng], 14, { duration: 1.2 }); setTimeout(() => m.openPopup(), 1200); });
    }
    section.appendChild(card);
  });
  placeListEl.appendChild(section);
}

// ── INIT ──
// Open Sicily directly (single trip for now)
openTrip(TRIPS[0]);
</script>
