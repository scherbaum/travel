<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Reisen</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  --radius: 8px;
  --transition: 0.18s ease;
}

[data-theme="dark"] {
  --bg: #111;
  --sidebar: #181818;
  --header-bg: #141008;
  --card: #1f1f1f;
  --card-hover: #272727;
  --card-active: #252520;
  --border: #2a2a2a;
  --text: #f0ece3;
  --text-muted: #777;
  --text-sub: #999;
  --accent: #d4a853;
  --insta: #E1306C;
  --tag-bg: #2a2a2a;
  --tag-text: #999;
  --popup-bg: rgba(18,16,12,0.97);
  --scrollbar: #333;
  --tip-bg: rgba(212,168,83,0.08);
  --tip-border: #c49a42;
  --tip-text: #c49a42;
  --breadcrumb-sep: #555;
  --trip-btn-hover: #252525;
  --plan-bg: #151510;
  --plan-border: #2a2510;
  --stop-bg: #1a1a14;
  --drive-color: #666;
}

[data-theme="light"] {
  --bg: #f2f0eb;
  --sidebar: #ffffff;
  --header-bg: #fffdf5;
  --card: #faf9f6;
  --card-hover: #f0ede5;
  --card-active: #ece9e0;
  --border: #e0ddd5;
  --text: #1a1810;
  --text-muted: #888;
  --text-sub: #666;
  --accent: #b8882a;
  --insta: #C2185B;
  --tag-bg: #ede9e0;
  --tag-text: #666;
  --popup-bg: rgba(255,253,248,0.97);
  --scrollbar: #ccc;
  --tip-bg: rgba(184,136,42,0.06);
  --tip-border: #b8882a;
  --tip-text: #9a6e1a;
  --breadcrumb-sep: #bbb;
  --trip-btn-hover: #f0ede5;
  --plan-bg: #fffcf0;
  --plan-border: #e8dfc0;
  --stop-bg: #f5f2e8;
  --drive-color: #999;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; transition: background var(--transition), color var(--transition); }

#app { display: flex; height: 100vh; }

/* ── SIDEBAR ── */
#sidebar { width: 380px; min-width: 380px; background: var(--sidebar); display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); z-index: 10; transition: background var(--transition); }

#header { padding: 14px 16px 12px; background: var(--header-bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#header-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-weight: 600; }

#theme-toggle { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; cursor: pointer; font-size: 0.75rem; color: var(--text-muted); transition: all var(--transition); font-family: var(--font); }
#theme-toggle:hover { border-color: var(--text-muted); color: var(--text); }

#breadcrumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bc-item { font-size: 0.85rem; font-weight: 600; color: var(--text); }
.bc-item.clickable { color: var(--accent); cursor: pointer; }
.bc-item.clickable:hover { text-decoration: underline; }
.bc-sep { font-size: 0.7rem; color: var(--breadcrumb-sep); }

/* Trip list */
#trip-list { padding: 12px; display: none; }
.trip-btn { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); cursor: pointer; margin-bottom: 8px; font-family: var(--font); color: var(--text); width: 100%; text-align: left; transition: all var(--transition); }
.trip-btn:hover { background: var(--trip-btn-hover); }
.trip-btn .trip-flag { font-size: 1.6rem; }
.trip-btn .trip-info { flex: 1; }
.trip-btn .trip-name { font-size: 0.95rem; font-weight: 600; }
.trip-btn .trip-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
.trip-add-btn { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius); border: 1px dashed var(--border); background: none; color: var(--text-muted); cursor: pointer; font-family: var(--font); font-size: 0.82rem; width: 100%; transition: all var(--transition); }
.trip-add-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Filters */
#filters { padding: 8px 10px 6px; display: flex; flex-wrap: wrap; gap: 5px; background: var(--header-bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.filter-btn { padding: 4px 9px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.67rem; transition: all var(--transition); font-family: var(--font); letter-spacing: 0.02em; }
.filter-btn:hover { color: var(--text); }
.filter-btn.active { color: #fff !important; border-color: transparent; font-weight: 600; }

/* Plan mode button */
#plan-toggle { margin-left: auto; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.67rem; font-family: var(--font); transition: all var(--transition); white-space: nowrap; }
#plan-toggle:hover { color: var(--accent); border-color: var(--accent); }
#plan-toggle.active { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }

/* Place list */
#place-list { overflow-y: auto; flex: 1; padding: 8px 10px 8px; scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
#place-list::-webkit-scrollbar { width: 4px; }
#place-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

.tour-section { margin-bottom: 6px; }
.tour-header { display: flex; align-items: center; gap: 7px; padding: 8px 4px 4px; font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); border-bottom: 1px solid var(--border); margin-bottom: 5px; }
.tour-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.place-card { background: var(--card); border-radius: var(--radius); padding: 10px 12px 10px 13px; margin-bottom: 5px; cursor: pointer; transition: all var(--transition); border-left: 3px solid transparent; position: relative; }
.place-card:hover { background: var(--card-hover); transform: translateX(2px); }
.place-card.active { background: var(--card-active); }
.place-card.in-tour { box-shadow: 0 0 0 1px var(--accent) inset; }

.card-top { display: flex; align-items: flex-start; gap: 9px; }
.card-emoji { font-size: 1.2rem; line-height: 1; flex-shrink: 0; margin-top: 1px; width: 26px; text-align: center; }
.card-body { flex: 1; min-width: 0; }
.card-name { font-size: 0.9rem; font-weight: 600; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 0.68rem; color: var(--text-sub); margin-bottom: 4px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
.tag { font-size: 0.6rem; padding: 2px 5px; border-radius: 8px; background: var(--tag-bg); color: var(--tag-text); }
.card-desc { font-size: 0.74rem; color: var(--text-sub); line-height: 1.45; }
.card-tips { margin-top: 6px; font-size: 0.68rem; color: var(--tip-text); border-top: 1px solid var(--border); background: var(--tip-bg); padding: 5px 6px; border-radius: 5px; }

/* Planning mode: add button on cards */
.card-plan-btn { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: var(--tag-bg); color: var(--text-muted); cursor: pointer; font-size: 1rem; line-height: 1; display: none; align-items: center; justify-content: center; transition: all var(--transition); z-index: 1; font-family: var(--font); }
.card-plan-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.card-plan-btn.added { background: var(--accent); color: #fff; border-color: var(--accent); }

body.planning .card-plan-btn { display: flex; }
body.planning .place-card { padding-right: 38px; }

/* Stop number badge */
.stop-badge { position: absolute; top: 8px; right: 36px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 0.6rem; font-weight: 700; display: none; align-items: center; justify-content: center; }
body.planning .stop-badge.visible { display: flex; }

/* Instagram cards */
.insta-card { display: flex; gap: 10px; align-items: flex-start; }
.insta-thumb { width: 58px; height: 58px; object-fit: cover; border-radius: 6px; flex-shrink: 0; border: 1px solid var(--border); }
.insta-thumb-placeholder { width: 58px; height: 58px; background: var(--tag-bg); border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; border: 1px solid var(--border); }
.insta-body { flex: 1; min-width: 0; }
.insta-user { font-size: 0.65rem; color: var(--insta); margin-bottom: 3px; }
.insta-link { display: inline-block; margin-top: 6px; font-size: 0.63rem; color: var(--insta); text-decoration: none; opacity: 0.8; }
.insta-link:hover { opacity: 1; }

/* ── TOUR PLAN PANEL ── */
#tour-panel { background: var(--plan-bg); border-top: 2px solid var(--plan-border); flex-shrink: 0; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
#tour-panel.open { max-height: 400px; }
#tour-panel-inner { padding: 10px; overflow-y: auto; max-height: 400px; scrollbar-width: thin; }

#tour-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#tour-panel-title { font-size: 0.75rem; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; }

.tour-panel-actions { display: flex; gap: 6px; }
.tpa-btn { padding: 4px 10px; border-radius: 16px; border: 1px solid var(--border); background: none; color: var(--text-sub); font-size: 0.65rem; cursor: pointer; font-family: var(--font); transition: all var(--transition); white-space: nowrap; }
.tpa-btn:hover { color: var(--text); }
.tpa-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.tpa-btn.primary:hover { opacity: 0.9; }

#tour-start-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
#tour-start-row label { font-size: 0.65rem; color: var(--text-muted); white-space: nowrap; }
#tour-start-time { background: var(--stop-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--font); font-size: 0.75rem; padding: 3px 7px; width: 80px; }

/* Stops list */
#stops-list { list-style: none; }
.stop-row { display: flex; align-items: center; gap: 7px; background: var(--stop-bg); border-radius: 7px; padding: 7px 8px; margin-bottom: 3px; border: 1px solid var(--border); }
.stop-num { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 0.58rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stop-info { flex: 1; min-width: 0; }
.stop-name { font-size: 0.78rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop-time { font-size: 0.62rem; color: var(--text-muted); }
.stop-controls { display: flex; gap: 2px; }
.stop-ctrl-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.75rem; padding: 2px 3px; border-radius: 4px; font-family: var(--font); transition: all var(--transition); }
.stop-ctrl-btn:hover { color: var(--text); background: var(--border); }

.drive-row { display: flex; align-items: center; gap: 6px; padding: 2px 8px; color: var(--drive-color); font-size: 0.62rem; }
.drive-line { flex: 1; border-top: 1px dashed var(--border); }

#tour-empty { text-align: center; padding: 16px 0; color: var(--text-muted); font-size: 0.75rem; }

/* ── MAP ── */
#map-container { flex: 1; position: relative; min-width: 0; }
#map { width: 100%; height: 100%; }

#map-hint { position: absolute; top: 12px; right: 12px; z-index: 500; background: var(--popup-bg); border-radius: 10px; padding: 8px 12px; border: 1px solid var(--border); font-size: 0.7rem; color: var(--text-muted); backdrop-filter: blur(8px); pointer-events: none; }
#map-hint strong { display: block; color: var(--accent); font-size: 0.8rem; margin-bottom: 1px; }

/* Leaflet */
.leaflet-popup-content-wrapper { background: var(--popup-bg) !important; color: var(--text) !important; border-radius: 10px !important; border: 1px solid var(--border) !important; box-shadow: 0 8px 24px rgba(0,0,0,0.4) !important; }
.leaflet-popup-tip { background: var(--popup-bg) !important; }
.leaflet-popup-content { margin: 13px 16px !important; }
.popup-emoji { font-size: 1.5rem; margin-bottom: 5px; }
.popup-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 3px; }
.popup-sub { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 7px; font-style: italic; }
.popup-highlights { list-style: none; font-size: 0.76rem; color: var(--text-sub); line-height: 1.7; }
.popup-highlights li::before { content: "✦ "; color: var(--accent); }
.popup-tip { margin-top: 7px; padding: 6px 8px; background: var(--tip-bg); border-radius: 5px; font-size: 0.7rem; color: var(--tip-text); font-style: italic; border-left: 2px solid var(--tip-border); }
.leaflet-control-attribution { font-size: 0.58rem; background: var(--popup-bg) !important; color: var(--text-muted) !important; }
.leaflet-control-attribution a { color: var(--text-muted) !important; }
.leaflet-control-zoom a { background: var(--card) !important; color: var(--text) !important; border-color: var(--border) !important; }
.leaflet-control-zoom a:hover { background: var(--card-hover) !important; }

/* ── TIMELINE OVERLAY ── */
#timeline-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
#timeline-overlay.open { display: flex; }
#timeline-box { background: var(--sidebar); border-radius: 14px; border: 1px solid var(--border); width: min(420px, 95vw); max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden; }
#timeline-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--header-bg); }
#timeline-title { font-size: 0.95rem; font-weight: 700; }
#timeline-close { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.2rem; font-family: var(--font); }
#timeline-body { overflow-y: auto; padding: 16px; flex: 1; }

.tl-stop { display: flex; gap: 12px; }
.tl-line { display: flex; flex-direction: column; align-items: center; }
.tl-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: #fff; flex-shrink: 0; }
.tl-connector { width: 2px; flex: 1; min-height: 30px; margin: 3px 0; }
.tl-content { flex: 1; padding-bottom: 16px; }
.tl-time { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 2px; }
.tl-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
.tl-sub { font-size: 0.72rem; color: var(--text-sub); }
.tl-duration { display: inline-block; margin-top: 4px; font-size: 0.65rem; padding: 2px 7px; border-radius: 10px; background: var(--tag-bg); color: var(--tag-text); }

.tl-drive { display: flex; gap: 12px; align-items: center; padding-bottom: 4px; }
.tl-drive-line-col { display: flex; flex-direction: column; align-items: center; width: 28px; }
.tl-drive-connector { width: 2px; height: 30px; background: var(--border); }
.tl-drive-info { font-size: 0.68rem; color: var(--drive-color); font-style: italic; }
.tl-drive-car { font-size: 0.9rem; }

#timeline-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; background: var(--header-bg); }

/* mobile */
@media (max-width: 700px) {
  #app { flex-direction: column; }
  #sidebar { width: 100%; min-width: unset; max-height: 55vh; }
  #map-container { height: 45vh; flex: none; }
  #map-hint { display: none; }
  #tour-panel.open { max-height: 260px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="header">
      <div id="header-top">
        <div id="header-title">Meine Reisen</div>
        <button id="theme-toggle">☀️ Hell</button>
      </div>
      <div id="breadcrumb">
        <span class="bc-item clickable" id="bc-root">🌍 Alle Reisen</span>
        <span class="bc-sep" id="bc-sep" style="display:none">›</span>
        <span class="bc-item" id="bc-trip" style="display:none"></span>
      </div>
    </div>

    <div id="trip-list"></div>
    <div id="filters" style="display:none"></div>
    <div id="place-list"></div>

    <!-- Tour plan panel -->
    <div id="tour-panel">
      <div id="tour-panel-inner">
        <div id="tour-panel-header">
          <div id="tour-panel-title">📍 Meine Tagestour</div>
          <div class="tour-panel-actions">
            <input type="time" id="tour-start-time" value="09:00" title="Startzeit">
            <button class="tpa-btn" id="btn-timeline" title="Timeline anzeigen">🗓 Timeline</button>
            <button class="tpa-btn primary" id="btn-maps" title="In Google Maps öffnen">🗺 Maps</button>
          </div>
        </div>
        <ul id="stops-list"></ul>
        <div id="tour-empty">Orte antippen um zur Tagestour hinzuzufügen</div>
      </div>
    </div>
  </div>

  <div id="map-container">
    <div id="map"></div>
    <div id="map-hint">
      <strong>Klicke einen Ort</strong>
      für Details &amp; Tipps
    </div>
  </div>
</div>

<!-- Timeline overlay -->
<div id="timeline-overlay">
  <div id="timeline-box">
    <div id="timeline-header">
      <div id="timeline-title">📅 Tagestour Timeline</div>
      <button id="timeline-close">✕</button>
    </div>
    <div id="timeline-body"></div>
    <div id="timeline-footer">
      <button class="tpa-btn" id="tl-maps-btn">🗺 In Google Maps öffnen</button>
    </div>
  </div>
</div>

    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'

}

function setPlanningMode(on) {

  document.body.classList.toggle('planning', on);
  planToggleBtn.classList.toggle('active', on);

  if (on) {

    renderTourPanel();
  } else {
    tourPanel.classList.remove('open');
    clearRouteOnMap();
  }
}

function toggleTourStop(place, tour) {
  const idx = tourPlan.findIndex(s => s.place.id === place.id);
  if (idx === -1) {
    tourPlan.push({ place, tour });
  } else {
    tourPlan.splice(idx, 1);
  }
  renderTourPanel();
  updateCardBadges();
  drawRouteOnMap();
}

function updateCardBadges() {
  document.querySelectorAll('.card-plan-btn, .stop-badge').forEach(el => {
    const id = el.closest('[data-place-id]')?.dataset.placeId;
    if (!id) return;
    const idx = tourPlan.findIndex(s => s.place.id === id);
    if (el.classList.contains('card-plan-btn')) {
      el.textContent = idx === -1 ? '+' : '−';
      el.classList.toggle('added', idx !== -1);
    }
    if (el.classList.contains('stop-badge')) {
      el.textContent = idx === -1 ? '' : (idx + 1);
      el.classList.toggle('visible', idx !== -1);
    }
  });
}

// ── TOUR PANEL ──
const stopsList = document.getElementById('stops-list');
const tourEmptyEl = document.getElementById('tour-empty');

function renderTourPanel() {
  stopsList.innerHTML = '';
  if (tourPlan.length === 0) {
    tourEmptyEl.style.display = 'block'; return;
  }
  tourEmptyEl.style.display = 'none';
  const startTime = parseTime(document.getElementById('tour-start-time').value || '09:00');
  let current = startTime;

  tourPlan.forEach(({ place, tour }, i) => {
    if (i > 0) {
      const prev = tourPlan[i-1].place;
      const { dist, minutes } = driveEstimate(prev, place);
      const driveLi = document.createElement('div');
      driveLi.className = 'drive-row';
      driveLi.innerHTML = `<div class="drive-line"></div><span>🚗 ~${minutes} Min (${dist} km Luftlinie)</span><div class="drive-line"></div>`;
      stopsList.appendChild(driveLi);
      current += minutes;
    }

    const li = document.createElement('li');
    li.className = 'stop-row';
    const arrTime = formatTime(current);
    current += place.visitMin || 90;
    li.innerHTML = `
      <div class="stop-num">${i+1}</div>
      <div class="stop-info">
        <div class="stop-name">${place.emoji} ${place.name}</div>
        <div class="stop-time">Ankunft ~${arrTime} · ${place.visitMin || 90} Min Besuch</div>
      </div>
      <div class="stop-controls">
        <button class="stop-ctrl-btn" data-idx="${i}" data-dir="-1" title="Früher">↑</button>
        <button class="stop-ctrl-btn" data-idx="${i}" data-dir="1" title="Später">↓</button>
        <button class="stop-ctrl-btn" data-idx="${i}" data-dir="x" title="Entfernen" style="color:#E07B69">✕</button>
      </div>`;
    stopsList.appendChild(li);
  });

  // wire buttons
  stopsList.querySelectorAll('.stop-ctrl-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = +btn.dataset.idx;
      const dir = btn.dataset.dir;
      if (dir === 'x') { tourPlan.splice(idx, 1); }
      else if (dir === '-1' && idx > 0) { [tourPlan[idx], tourPlan[idx-1]] = [tourPlan[idx-1], tourPlan[idx]]; }
      else if (dir === '1' && idx < tourPlan.length - 1) { [tourPlan[idx], tourPlan[idx+1]] = [tourPlan[idx+1], tourPlan[idx]]; }
      renderTourPanel(); updateCardBadges(); drawRouteOnMap();
    });
  });
}

document.getElementById('tour-start-time').addEventListener('change', renderTourPanel);

// ── TIME HELPERS ──
function parseTime(str) { const [h, m] = str.split(':').map(Number); return h * 60 + m; }
function formatTime(min) { const h = Math.floor(min / 60) % 24, m = min % 60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }

// ── DRIVE ESTIMATE ──
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function driveEstimate(p1, p2) {
  const d = haversine(p1.lat, p1.lng, p2.lat, p2.lng);
  const roadFactor = 1.45; // Sicily winding roads
  const avgSpeed = 65; // km/h
  const dist = Math.round(d * roadFactor);
  const minutes = Math.max(5, Math.round(d * roadFactor / avgSpeed * 60));
  return { dist, minutes };
}

// ── ROUTE ON MAP ──
function drawRouteOnMap() {
  clearRouteOnMap();
  if (tourPlan.length < 2) return;
  const pts = tourPlan.filter(s => s.place.lat).map(s => [s.place.lat, s.place.lng]);
  if (pts.length < 2) return;
  tourRouteLayer = L.polyline(pts, { color: theme === 'dark' ? '#d4a853' : '#b8882a', weight: 3, opacity: 0.7, dashArray: '8,5' }).addTo(map);
}

function clearRouteOnMap() {
  if (tourRouteLayer) { map.removeLayer(tourRouteLayer); tourRouteLayer = null; }
}

// ── GOOGLE MAPS ──
document.getElementById('btn-maps').addEventListener('click', openGoogleMaps);
document.getElementById('tl-maps-btn').addEventListener('click', openGoogleMaps);

function openGoogleMaps() {
  const stops = tourPlan.filter(s => s.place.lat);
  if (stops.length === 0) { alert('Keine Orte mit Koordinaten in der Tour.'); return; }
  if (stops.length === 1) {
    window.open(`https://www.google.com/maps?q=${stops[0].place.lat},${stops[0].place.lng}`, '_blank');
    return;
  }
  const coords = stops.map(s => `${s.place.lat},${s.place.lng}`);
  const origin = coords[0];
  const destination = coords[coords.length - 1];
  const waypoints = coords.slice(1, -1).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
  if (waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
  window.open(url, '_blank');
}

document.getElementById('btn-timeline').addEventListener('click', showTimeline);
document.getElementById('timeline-close').addEventListener('click', () => {
  document.getElementById('timeline-overlay').classList.remove('open');
});

function showTimeline() {
  if (tourPlan.length === 0) { alert('Keine Orte in der Tagestour.'); return; }
  const body = document.getElementById('timeline-body');
  body.innerHTML = '';
  const startTime = parseTime(document.getElementById('tour-start-time').value || '09:00');
  let current = startTime;

  tourPlan.forEach(({ place, tour }, i) => {
    if (i > 0) {
      const prev = tourPlan[i-1].place;
      const { dist, minutes } = driveEstimate(prev, place);
      const driveDiv = document.createElement('div');
      driveDiv.className = 'tl-drive';
      driveDiv.innerHTML = `
        <div class="tl-drive-line-col"><div class="tl-drive-connector" style="background:${tour.color}55"></div></div>
        <div class="tl-drive-car">🚗</div>
        <div class="tl-drive-info">~${minutes} Min Fahrt (${dist} km)</div>`;
      body.appendChild(driveDiv);
      current += minutes;
    }

    const arrTime = formatTime(current);
    const endTime = formatTime(current + (place.visitMin || 90));
    current += place.visitMin || 90;
    const isLast = i === tourPlan.length - 1;

    const stopDiv = document.createElement('div');
    stopDiv.className = 'tl-stop';
    stopDiv.innerHTML = `
      <div class="tl-line">
        <div class="tl-dot" style="background:${tour.color}">${i+1}</div>
        ${!isLast ? `<div class="tl-connector" style="background:${tour.color}44"></div>` : ''}
      </div>
      <div class="tl-content">
        <div class="tl-time">${arrTime} Uhr</div>
        <div class="tl-name">${place.emoji} ${place.name}</div>
        <div class="tl-sub">${place.sub}</div>
        <span class="tl-duration">bis ~${endTime} Uhr · ${place.visitMin || 90} Min</span>
      </div>`;
    body.appendChild(stopDiv);
  });

  const totalMin = current - startTime;
  const summary = document.createElement('div');
  summary.style.cssText = 'margin-top:12px;padding:10px;background:var(--tag-bg);border-radius:8px;font-size:0.78rem;text-align:center;color:var(--text-sub)';
  summary.innerHTML = `Gesamtdauer: <strong>${Math.floor(totalMin/60)}h ${totalMin%60}min</strong> · ${tourPlan.length} Stopps`;
  body.appendChild(summary);

  document.getElementById('timeline-overlay').classList.add('open');
}

function buildFilters(trip) {
  filtersEl.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.dataset.tour = 'all';
  allBtn.style.cssText = 'background:#555;color:#fff;border-color:transparent';
  allBtn.textContent = 'Alle';
  allBtn.addEventListener('click', () => setTour(trip, 'all', allBtn));
  filtersEl.appendChild(allBtn);
  trip.tours.forEach(tour => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.tour = tour.id;
    btn.style.cssText = `color:${tour.color};border-color:${tour.color}55`;
    btn.textContent = `${tour.emoji} ${tour.name.split(' ')[0]}`;
    btn.addEventListener('click', () => setTour(trip, tour.id, btn));
    filtersEl.appendChild(btn);
  });

  const planBtn = document.createElement('button');
  planBtn.id = 'plan-toggle';
  planBtn.textContent = '📍 Tagestour';
  planBtn.addEventListener('click', () => setPlanningMode(!planningMode));
  filtersEl.appendChild(planBtn);
}

function setTour(trip, tourId, clickedBtn) {
  activeTour = tourId;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = 'transparent';
    const t = trip.tours.find(x => x.id === b.dataset.tour);
    if (t) b.style.color = t.color;
    if (b.dataset.tour === 'all') { b.style.color = 'var(--text-muted)'; b.style.borderColor = 'var(--border)'; }
  });
  clickedBtn.classList.add('active');
  if (tourId === 'all') { clickedBtn.style.background = '#555'; clickedBtn.style.color = '#fff'; clickedBtn.style.borderColor = 'transparent'; }
  else { const t = trip.tours.find(x => x.id === tourId); clickedBtn.style.background = t.color; clickedBtn.style.color = '#fff'; clickedBtn.style.borderColor = 'transparent'; }

  trip.tours.forEach(t => {
    t.places.forEach(p => {
      const m = markers[p.id];
      if (!m) return;
      if (tourId === 'all' || t.id === tourId) m.marker.addTo(map);
      else map.removeLayer(m.marker);
    });
  });

  if (tourId !== 'all') {
    const t = trip.tours.find(x => x.id === tourId);
    const lats = t.places.map(p => p.lat), lngs = t.places.map(p => p.lng);
    map.flyTo([lats.reduce((a,b)=>a+b)/lats.length, lngs.reduce((a,b)=>a+b)/lngs.length], 10, { duration: 1 });
  } else {
    map.flyTo(trip.center, trip.zoom, { duration: 1 });
  }
  buildPlaceList(trip, tourId);
}

// ── PLACE LIST ──
function buildPlaceList(trip, tourId) {
  placeListEl.innerHTML = '';
  const toShow = tourId === 'all' ? trip.tours : trip.tours.filter(t => t.id === tourId);
  toShow.forEach(tour => {
    const section = document.createElement('div');
    section.className = 'tour-section';
    section.innerHTML = `<div class="tour-header"><div class="tour-dot" style="background:${tour.color}"></div>${tour.emoji} ${tour.name}</div>`;
    tour.places.forEach(place => {
      section.appendChild(makePlaceCard(place, tour));
    });
    placeListEl.appendChild(section);
  });
}

function makePlaceCard(place, tour) {
  const card = document.createElement('div');
  card.className = 'place-card';
  card.id = 'card-' + place.id;
  card.dataset.placeId = place.id;
  card.style.borderLeftColor = tour.color;

  const inTour = tourPlan.findIndex(s => s.place.id === place.id);
  const planBtnText = inTour === -1 ? '+' : '−';
  const addedClass = inTour !== -1 ? 'added' : '';
  const badgeText = inTour !== -1 ? (inTour + 1) : '';
  const badgeVisible = inTour !== -1 ? 'visible' : '';

  card.innerHTML = `
    <div class="stop-badge ${badgeVisible}">${badgeText}</div>
    <button class="card-plan-btn ${addedClass}" title="Zur Tagestour hinzufügen">${planBtnText}</button>
    <div class="card-top">
      <div class="card-emoji">${place.emoji}</div>
      <div class="card-body">
        <div class="card-name">${place.name}</div>
        <div class="card-sub">${place.sub}</div>
        <div class="card-tags">${place.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="card-desc">${place.desc}</div>
        ${place.tip ? `<div class="card-tips">💡 ${place.tip}</div>` : ''}
      </div>
    </div>`;

  card.querySelector('.card-plan-btn').addEventListener('click', e => {
    e.stopPropagation();
    toggleTourStop(place, tour);
    // update this card's btn
    const idx = tourPlan.findIndex(s => s.place.id === place.id);
    card.querySelector('.card-plan-btn').textContent = idx === -1 ? '+' : '−';
    card.querySelector('.card-plan-btn').classList.toggle('added', idx !== -1);
    const badge = card.querySelector('.stop-badge');
    badge.textContent = idx === -1 ? '' : (idx + 1);
    badge.classList.toggle('visible', idx !== -1);
  });

  card.addEventListener('click', () => {
    const m = markers[place.id];
    if (m) {
      map.flyTo([place.lat, place.lng], 13, { duration: 1.2 });
      setTimeout(() => m.marker.openPopup(), 1200);
      highlightCard(place.id, tour.color, m.marker, tour);
    }
  });
  return card;
}

// ── MARKERS ──
function buildMarkers(trip) {
  resetMarkers();
  trip.tours.forEach(tour => {
    tour.places.forEach(place => {
      const marker = L.marker([place.lat, place.lng], { icon: makeIcon(tour.color, tour.emoji) }).addTo(map);
      marker.bindPopup(`<div class="popup-emoji">${place.emoji}</div><div class="popup-title">${place.name}</div><div class="popup-sub">${place.sub}</div><ul class="popup-highlights">${place.highlights.slice(0,4).map(h=>`<li>${h}</li>`).join('')}</ul>${place.tip?`<div class="popup-tip">💡 ${place.tip}</div>`:''}`);
      marker.on('click', () => highlightCard(place.id, tour.color, marker, tour));
      markers[place.id] = { marker, tour };
    });
  });
}

function highlightCard(placeId, color, marker, tour) {
  if (activeCardId) {
    const prev = document.getElementById('card-' + activeCardId);
    if (prev) prev.classList.remove('active');
    const pm = markers[activeCardId];
    if (pm) pm.marker.setIcon(makeIcon(pm.tour.color, pm.tour.emoji));
  }
  const card = document.getElementById('card-' + placeId);
  if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  marker.setIcon(makeIcon(color, tour.emoji, true));
  activeCardId = placeId;
}

// ── USER SPOTS ──
async function loadUserSpots(tripId) {
  try {
    const res = await fetch('/user-spots.json?v=' + Date.now());
    if (!res.ok) return;
    const spots = await res.json();
    const tripSpots = spots.filter(s => !s.trip || s.trip === tripId);
    if (!tripSpots.length) return;
    renderUserSpots(tripSpots);
  } catch(e) {}
}

function renderUserSpots(spots) {
  const section = document.createElement('div');
  section.className = 'tour-section';
  section.innerHTML = `<div class="tour-header"><div class="tour-dot" style="background:var(--insta)"></div>📸 Deine Fundstücke</div>`;
  spots.forEach(spot => {
    const card = document.createElement('div');
    card.className = 'place-card';
    card.id = 'spot-' + spot.id;
    card.dataset.placeId = 'spot-' + spot.id;
    card.style.borderLeftColor = 'var(--insta)';
    const img = spot.image ? `<img src="${spot.image}" class="insta-thumb" alt="">` : `<div class="insta-thumb-placeholder">📸</div>`;
    card.innerHTML = `<div class="insta-card">${img}<div class="insta-body"><div class="card-name" style="font-size:0.85rem">${spot.name}</div><div class="insta-user">@${spot.username}</div><div class="card-tags">${(spot.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="card-desc" style="font-size:0.72rem">${spot.desc}</div><a href="${spot.source_url}" target="_blank" class="insta-link">→ Instagram</a></div></div>`;
    if (spot.lat && spot.lng) {
      const m = L.marker([spot.lat, spot.lng], { icon: makeIcon('var(--insta)', '📸') }).addTo(map).bindPopup(`<div class="popup-emoji">📸</div><div class="popup-title">${spot.name}</div><div class="popup-sub">@${spot.username}</div>`);
      card.addEventListener('click', () => { map.flyTo([spot.lat, spot.lng], 14, { duration: 1.2 }); setTimeout(() => m.openPopup(), 1200); });
    }
    section.appendChild(card);
  });
  placeListEl.appendChild(section);
}

// ── INIT ──
openTrip(TRIPS[0]);
</script>
