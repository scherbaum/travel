name: Deploy to travel.modulon.org

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 82.165.170.94 >> ~/.ssh/known_hosts

      - name: Deploy to Dokku
        run: |
          git remote add dokku ssh://dokku@82.165.170.94/travel
          git push dokku main --force
